<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Road Rush</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:sans-serif;touch-action:none;user-select:none}
#hud{position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font-size:20px;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none}
#msg{z-index:10;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.55);font-size:26px;text-align:center;line-height:1.5}
#msg small{font-size:15px;opacity:.8}
.z{position:fixed;bottom:0;width:50%;height:45%;display:flex;align-items:flex-end;justify-content:center;color:rgba(255,255,255,.35);font-size:60px;padding-bottom:20px;box-sizing:border-box}
#J{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:5;padding:16px 22px;border-radius:40px;background:rgba(255,255,255,.25);color:#fff;font-size:20px;font-weight:700}
</style></head><body>
<div id="hud">0 m · 0 km/h</div>
<div id="msg"><div>🏎️ ROAD RUSH<br><small>좌우로 핸들링, 차들을 피하세요<br>화면 왼쪽/오른쪽 터치 · 키보드 ←→ / A D<br><br>탭해서 시작</small></div></div>
<div id="J">⤒ 점프</div><div class="z" id="L" style="left:0">◀</div><div class="z" id="R" style="right:0">▶</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const hud=document.getElementById('hud'),msg=document.getElementById('msg');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b8e8);scene.fog=new THREE.Fog(0x87b8e8,40,170);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,.9));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(20,40,20);scene.add(sun);
const M=(c)=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));
// ground + road
const ground=box(400,1,400,0x3d8b3d);ground.position.y=-.5;scene.add(ground);
const road=box(10,1,400,0x333333);road.position.y=-.4;scene.add(road);
const dashes=[];for(let i=0;i<20;i++){for(const x of[-1.7,1.7]){const d=box(.2,.05,4,0xffffff);d.position.set(x,.1,-i*10);scene.add(d);dashes.push(d)}}
// side objects
const side=[];
function mkAd(){const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');g.fillStyle='#ffcc00';g.fillRect(0,0,256,128);g.fillStyle='#111';g.font='bold 34px sans-serif';g.textAlign='center';g.fillText('YOUR AD',128,58);g.fillText('HERE',128,100);
return new THREE.Mesh(new THREE.PlaneGeometry(8,4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}))}
for(let i=0;i<14;i++)for(const s of[-1,1]){
 let o;if(Math.random()<.2){o=new THREE.Group();const p=box(.4,5,.4,0x888888);p.position.y=2.5;const a=mkAd();a.position.y=6;a.rotation.y=-s*.5;o.add(p,a)}
 else{const h=6+Math.random()*22;o=box(6+Math.random()*4,h,6+Math.random()*4,[0x9aa5b1,0xb08968,0x7d8fa0,0xc9b79c][i%4]);o.position.y=h/2}
 o.position.x=s*(12+Math.random()*8);o.position.z=-i*16;o.userData.x=o.position.x;scene.add(o);side.push(o)}
// cars
function mkCar(c){const g=new THREE.Group();const b=box(2,.7,4.2,c);b.position.y=.65;const t=box(1.7,.6,2,0x222831);t.position.set(0,1.25,.2);g.add(b,t);
for(const x of[-1,1])for(const z of[-1.3,1.3]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,12),M(0x111111));w.rotation.z=Math.PI/2;w.position.set(x,.4,z);g.add(w)}return g}
const player=mkCar(0xe63946);scene.add(player);
let traffic=[];
// state
let jy=0,vy=0,parts=[],run=false,speed=0,dist=0,x=0,steer=0,key=0,touch=0,spawnT=0,best=0;
try{best=+localStorage.getItem('rr_best')||0}catch(e){}
function reset(){traffic.forEach(c=>scene.remove(c));traffic=[];player.visible=true;jy=0;vy=0;speed=22;dist=0;x=0;spawnT=0;run=true;msg.style.display='none'}
function boom(){for(let i=0;i<45;i++){const m=box(.5,.5,.5,[0xff5500,0xffaa00,0xffdd33,0x444444][i%4]);m.position.set(x,1+jy,0);m.userData.v=new THREE.Vector3((Math.random()-.5)*14,Math.random()*12+3,(Math.random()-.5)*14);m.userData.l=1.2;scene.add(m);parts.push(m)}}
function jump(){if(run&&jy===0){vy=11;jy=.001}}
function over(){run=false;player.visible=false;boom();const s=Math.floor(dist);if(s>best){best=s;try{localStorage.setItem('rr_best',s)}catch(e){}}
 setTimeout(()=>{msg.innerHTML='<div>💥 충돌!<br>'+s+' m<br><small>최고 기록 '+best+' m<br><br>탭해서 다시 시작</small></div>';msg.style.display='flex'},900)}
msg.addEventListener('pointerdown',()=>{if(!run)reset()});
// input
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))key=-1;if(['ArrowRight','d','D'].includes(e.key))key=1;if(!run&&e.key==='Enter')reset();if([' ','ArrowUp','w','W'].includes(e.key))jump()});
addEventListener('keyup',()=>key=0);
document.getElementById('J').addEventListener('pointerdown',jump);
for(const[id,v]of[['L',-1],['R',1]]){const el=document.getElementById(id);el.addEventListener('pointerdown',()=>touch=v);el.addEventListener('pointerup',()=>touch=0);el.addEventListener('pointerleave',()=>touch=0)}
// loop
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 if(run){
  speed=Math.min(40,speed+dt*.5);if(jy>0||vy>0){vy-=28*dt;jy=Math.max(0,jy+vy*dt);if(jy===0)vy=0}dist+=speed*dt;
  const want=key||touch;steer+=(want-steer)*Math.min(1,dt*8);
  x=Math.max(-4,Math.min(4,x+steer*dt*9));
  spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.45,1.3-dist/1500);const c=mkCar(new THREE.Color().setHSL(Math.random(),.7,.5).getHex());c.position.set((Math.floor(Math.random()*3)-1)*3.4+(Math.random()-.5),0,-170);c.userData.v=10+Math.random()*8;scene.add(c);traffic.push(c)}
  for(let i=traffic.length-1;i>=0;i--){const c=traffic[i];c.position.z+=(speed-c.userData.v)*dt;
   if(c.position.z>15){scene.remove(c);traffic.splice(i,1);continue}
   if(run&&jy<1.6&&Math.abs(c.position.x-x)<1.9&&Math.abs(c.position.z)<4)over()}
 }
 const mv=run?speed:6;
 dashes.forEach(d=>{d.position.z+=mv*dt;if(d.position.z>10)d.position.z-=200});
 side.forEach(o=>{o.position.z+=mv*dt;if(o.position.z>20){o.position.z-=224}});
 player.position.x=x;player.position.y=jy;player.rotation.y=-steer*.25;
 cam.position.set(x*.6,4.2,9);cam.lookAt(x*.4,1,-12);
for(let i=parts.length-1;i>=0;i--){const q=parts[i],u=q.userData;u.v.y-=25*dt;q.position.addScaledVector(u.v,dt);q.rotation.x+=dt*6;u.l-=dt;if(u.l<=0){scene.remove(q);parts.splice(i,1)}}
 if(run)hud.textContent=Math.floor(dist)+' m · '+Math.floor(speed*3.6/1.6)+' km/h';
 ren.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
